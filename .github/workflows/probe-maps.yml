name: Probe NSW map services

# Checks the NSW map and planning services the map placement relies on (scripts/probe-nsw-maps.mjs).
# Run it by hand (Actions › Probe NSW map services › Run workflow) when the map placement
# stops finding lots, planning layers or ground levels: the services' replies are printed in the log.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Which services: all, maps or elevation'
        required: false
        default: all

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-nsw-maps.mjs "$ONLY"
        env:
          ONLY: ${{ inputs.only || 'all' }}
