# The Cloudflare Worker that serves the app and its cloud saves from one origin.
# The deploy workflow (.github/workflows/cloudflare.yml) creates the D1 database and the KV
# namespace on first run and fills in their ids in a copy of this file; the ids below are only
# for `wrangler dev`, which keeps both locally.

name = "block-and-house-planner"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
# The API is the Worker's; everything else is the built app.
run_worker_first = ["/api/*"]

[vars]
# Who may create an account: "first" lets only the first person in (then it closes),
# "invite" needs INVITE_CODE (a secret), "open" lets anyone in, "closed" nobody.
SIGNUP = "first"

[[d1_databases]]
binding = "DB"
database_name = "block-and-house-planner"
database_id = "00000000-0000-4000-8000-000000000000"
migrations_dir = "worker/migrations"

[[kv_namespaces]]
binding = "BLOBS"
id = "00000000000000000000000000000000"
