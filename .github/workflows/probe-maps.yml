name: Probe NSW map services

# Checks the NSW map and planning services the map placement relies on (scripts/probe-nsw-maps.mjs).
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-gavzco]
    paths: [scripts/probe-nsw-maps.mjs, .github/workflows/probe-maps.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-nsw-maps.mjs
