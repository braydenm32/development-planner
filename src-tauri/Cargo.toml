[package]
name = "contour-and-gable"
version = "0.5.1"
description = "Contour and Gable: plan a house on a contour survey, offline, with your files in a folder"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
name = "contour_and_gable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
