name: Probe NSW map services

# Checks the NSW map and planning services the map placement relies on (scripts/probe-nsw-maps.mjs).
# Run it by hand (Actions › Probe NSW map services › Run workflow) when the map placement
# stops finding lots or planning layers: the services' replies are printed in the log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-nsw-maps.mjs
