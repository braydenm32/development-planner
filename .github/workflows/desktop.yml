name: Desktop app

# Builds the desktop app (src-tauri) for Windows, Mac and Linux.
# - On a pull request that touches it, or run by hand: the installers are kept as the run's
#   artifacts (Actions › this run › Artifacts) for a week, to try before merging.
# - On a tag like desktop-v0.1.0: the same installers go onto a draft GitHub release, to check
#   and publish.

on:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
          - os: macos-latest
            name: mac
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            name: linux
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - name: Desktop tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # Mac signing and notarising, once the Apple secrets are in the repo (Settings › Secrets and
      # variables › Actions; see README › Desktop app). Only the secrets that are set are passed on, so
      # with none the Mac app is still built, signed ad hoc ("-") as before.
      - name: Mac signing
        if: matrix.name == 'mac'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Which secrets this job can see (never their values).
          for n in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!n}" ]; then echo "$n: set"; else echo "$n: missing"; fi
          done
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            {
              # One line, whichever way the .p12 was turned into base64.
              echo "APPLE_CERTIFICATE=$(printf %s "$APPLE_CERTIFICATE" | tr -d '\n\r ')"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Signing with the Developer ID certificate."
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
              echo "Notarising with Apple."
            else
              echo "::warning::Signed but not notarised: APPLE_ID, APPLE_PASSWORD or APPLE_TEAM_ID is missing."
            fi
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No Developer ID certificate in the secrets: signing ad hoc."
          fi
      - name: Build
        run: npx tauri build ${{ matrix.args }}
      - name: Check the Mac signature
        if: matrix.name == 'mac'
        shell: bash
        run: |
          app=$(find src-tauri/target -maxdepth 6 -path '*/release/bundle/macos/*.app' | head -1)
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature' || true
          spctl -a -vv "$app" 2>&1 || echo "::notice::Gatekeeper doesn't accept this build yet (expected until it is signed and notarised)."
          xcrun stapler validate "$app" 2>&1 || true
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target -path '*/release/bundle/*' -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: contour-and-gable-${{ matrix.name }}
          path: out/*
          retention-days: 7
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Contour & Gable desktop ${{ github.ref_name }}
          files: out/*
