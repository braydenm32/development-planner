name: Desktop app

# Builds the desktop app (src-tauri) for Windows, Mac and Linux.
# - On a pull request that touches it, or run by hand: the installers are kept as the run's
#   artifacts (Actions › this run › Artifacts) for a week, to try before merging.
# - On a tag like desktop-v0.1.0: the same installers go onto a draft GitHub release, to check
#   and publish.

on:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
          - os: macos-latest
            name: mac
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            name: linux
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - name: Desktop tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build
        run: npx tauri build ${{ matrix.args }}
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target -path '*/release/bundle/*' -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: contour-and-gable-${{ matrix.name }}
          path: out/*
          retention-days: 7
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Contour & Gable desktop ${{ github.ref_name }}
          files: out/*
